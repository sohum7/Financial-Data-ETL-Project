[MARKET_STACK_DEVELOPMENT_METADATA]
debug = true
log_level = DEBUG

[MARKET_STACK_METADATA]
name = Market Stack Application
base_url = https://api.marketstack.com/v2
symbols = AAPL,MSFT,GOOGL,GOOG,META,AMZN

bq_target_dataset_base = market_stack
bq_staging_dataset_base = market_stack_stg

bq_partition_column=market_dt
bq_partition_column_granularity=YEAR
bq_cluster_columns=symbol,market_dt

[MARKET_STACK_DIVIDENDS_METADATA]
name = dividends
raw_file_bucket_dir = bronze
raw_file_bucket_base = market-stack-data
raw_file_type = json
tfd_file_bucket_dir = silver
tfd_file_bucket_base = market-stack-data
tfd_file_type = parquet
