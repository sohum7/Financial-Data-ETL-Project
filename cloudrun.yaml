apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ms-cloudrun-etl-job
spec:
  template:
    spec:
      template:
        spec:
          serviceAccountName: ms-cloudrun-etl-sa
          containers:
            - name: ms-etl-container
              image: IMAGE_PLACEHOLDER
              command: ["python"]
              args: ["dividends/run_etl.py"]
              env:
                - name: GOOGLE_CLOUD_PROJECT
                  value: PROJECT_ID_PLACEHOLDER
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
          timeoutSeconds: 1800
          maxRetries: 3