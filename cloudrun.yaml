apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: market-stack-etl-cloudrun-job
spec:
  template:
    spec:
      template:
        spec:
          serviceAccountName: market-stack-etl-cloudrun-sa
          containers:
            - name: market-stack-etl-container
              image: IMAGE_PLACEHOLDER
              command: ["python"]
              args: ["dividends/run_etl.py"]
              env:
                - name: PROJECT_ID
                  value: PROJECT_ID_PLACEHOLDER
                - name: ENVIRONMENT
                  value: ENVIRONMENT_PLACEHOLDER
              resources:
                limits:
                  cpu: "2"
                  memory: "512Mi"
          timeoutSeconds: 1800
          maxRetries: 0