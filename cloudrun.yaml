apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ms-dividends-etl-job
spec:
  template:
    spec:
      template:
        spec:
          # Ensure this service account exists in your project
          serviceAccountName: ms-cloudrun-etl
          containers:
            - name: ms-etl-container
              # Cloud Build will swap this placeholder for the real image
              image: IMAGE_PLACEHOLDER
              command: ["python"]
              args: ["dividends/run_etl.py"]
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
          timeoutSeconds: 1800