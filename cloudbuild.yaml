options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REPO_NAME: financial-data-etl-project
  _IMAGE_NAME: ms-etl
  _REGION: us-central1

steps:
  # Step 1: Build & Tag
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Construct the base path
        FULL_PATH="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME"
        
        echo "Pulling latest for cache..."
        docker pull $${FULL_PATH}:latest || exit 0
        
        echo "Building image with tags..."
        docker build \
          --cache-from $${FULL_PATH}:latest \
          -t $${FULL_PATH}:$COMMIT_SHA \
          -t $${FULL_PATH}:latest \
          .

  # Step 2: Push
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        FULL_PATH="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME"
        
        echo "Pushing Commit SHA tag..."
        docker push $${FULL_PATH}:$COMMIT_SHA
        
        echo "Pushing Latest tag..."
        docker push $${FULL_PATH}:latest

  # Step 3: Deploy
  - id: 'deploy-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        FULL_PATH="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME"
        sed -i "s|IMAGE_PLACEHOLDER|$${FULL_PATH}:$COMMIT_SHA|g" cloudrun.yaml
        gcloud run jobs replace cloudrun.yaml --region=$_REGION

  # Step 4: Execute
  - id: 'run-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args: ['run', 'jobs', 'execute', 'ms-dividends-etl-job', '--region=$_REGION']

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest'