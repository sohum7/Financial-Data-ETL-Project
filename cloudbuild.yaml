options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

substitutions:
  _REPO_NAME: financial-data-etl-project
  _IMAGE_NAME: ms-etl
  _REGION: us-central1

steps:
  # Step 1: Pull existing image for cache and Build new image
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Pull the latest image to use its layers for caching. 
        # '|| exit 0' ensures the build continues even if no 'latest' image exists yet.
        docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest || exit 0
        
        docker build \
          --cache-from $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest \
          -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA \
          -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest \
          .

  # Step 2: Push images to Artifact Registry (pushes both SHA and latest)
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME']

  # Step 3: Update YAML and Deploy Cloud Run Job
  - id: 'deploy-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_PATH="$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA"
        sed -i "s|IMAGE_PLACEHOLDER|$${IMAGE_PATH}|g" cloudrun.yaml
        gcloud run jobs replace cloudrun.yaml --region=$_REGION

  # Step 4: Execute the Job (Fixed job name to match cloudrun.yaml)
  - id: 'run-job'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run' 
      - 'jobs' 
      - 'execute' 
      - 'ms-dividends-etl-job'
      - '--region=$_REGION'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:latest'