steps:

# 1️⃣ Build image
- id: build
  name: gcr.io/cloud-builders/docker
  args:
    [
      "build",
      "-t",
      "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA",
      "."
    ]
  waitFor: ['-']  # starts immediately

# 2️⃣ Prepare YAML in-place (replace IMAGE_PLACEHOLDER)
- id: prepare-yaml
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
    - -c
    - |
      sed -i "s|IMAGE_PLACEHOLDER|$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA|g" cloudrun.yaml
      sed -i "s|PROJECT_ID_PLACEHOLDER|$PROJECT_ID|g" cloudrun.yaml
  waitFor: ['-']  # can run in parallel with build

# 3️⃣ Push image (waits for build)
- id: push
  name: gcr.io/cloud-builders/docker
  args:
    [
      "push",
      "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA"
    ]
  waitFor: ['build']

# 4️⃣ Deploy Cloud Run Job (waits for push + prepared YAML)
- id: deploy-job
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  args:
    [
      "gcloud",
      "run",
      "jobs",
      "replace",
      "cloudrun.yaml",
      "--region=$_REGION"
    ]
  waitFor: ['push', 'prepare-yaml']

# 5️⃣ Execute Job (waits for deploy)
- id: run-job
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  args:
    [
      "gcloud",
      "run",
      "jobs",
      "execute",
      "ms-cloudrun-etl-job",
      "--region=$_REGION"
    ]
  waitFor: ['deploy-job']

images:
- "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_IMAGE_NAME:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _REPO_NAME: financial-data-etl-project
  _IMAGE_NAME: ms-etl
  _REGION: us-central1