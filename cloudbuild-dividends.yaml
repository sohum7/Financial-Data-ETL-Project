apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: etl-pipeline
  namespace: default
spec:
  template:
    spec:
      # Cloud Run service account with proper IAM roles
      serviceAccountName: ms-cloudrun-etl
      containers:
        - image: gcr.io/${PROJECT_ID}/etl-pipeline:latest
          env:
            - name: PROJECT_ID
              value: "${PROJECT_ID}"   # dynamic project ID
          resources:
            limits:
              memory: "512Mi"
              cpu: "1"
      containerConcurrency: 1
      timeoutSeconds: 900
  traffic:
    - latestRevision: true
      percent: 100