apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ms-etl-pipeline-job
  namespace: default
spec:
  template:
    spec:
      serviceAccountName: ms-cloudrun-etl   # your SA
      containers:
        - image: gcr.io/${PROJECT_ID}/etl-pipeline:latest
          env:
            - name: PROJECT_ID
              value: "${PROJECT_ID}"         # dynamic project ID
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
      timeoutSeconds: 1800                    # adjust if ETL runs long
      maxRetries: 1                           # retry if job fails
  executionTemplate:
    parallelism: 1                             # 1 container runs per job
    taskCount: 1